# 云服务器部署：Caddy 自动申请 HTTPS 证书并反向代理到 Student OS
# 用法：cp .env.example .env && 编辑 DOMAIN && docker compose up -d --build
services:
  app:
    image: ${STUDENTOS_IMAGE:-studentos:local}
    build:
      context: ..
      args:
        GIT_SHA: ${GIT_SHA:-}
    restart: unless-stopped
    environment:
      PUBLIC_URL: https://${DOMAIN:?请在 deploy/.env 中设置 DOMAIN}
      TRUST_PROXY: "1"
    volumes:
      - studentos-data:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  studentos-data:
  caddy-data:
  caddy-config:
