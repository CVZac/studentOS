name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # 三种构建：静态站点、云端（前端 + 服务器）、Artifact 单页
      - run: npm run build
      - run: npm run build:cloud
      - run: npm run build:artifact

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image and smoke test
        run: |
          docker build -t studentos:ci .
          docker run -d --name sos -p 8080:8080 studentos:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/api/health && exit 0; sleep 1; done
          docker logs sos
          exit 1
